[project]
name = "catalog-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "dishka>=1.10.1",
    "fastapi>=0.143.0",
    "greenlet>=3.5.6",
    "orderflow-core",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pystolint>=0.6.1",
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true

[tool.ruff.lint]
ignore = [
    "PLR6301", # Method could be a function, class method, or static method
]

[tool.uv.sources]
orderflow-core = { git = "https://github.com/db2468362/orderflow-core.git", tag = "v0.2.3" }
